services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: my_sql_server
    # 👇 SET YOUR CUSTOM SERVER NAME HERE
    hostname: PI
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=123
    # 👇 This boots SQL Server, waits 15 seconds, then creates your custom database
    command: >
      bash -c "
      /opt/mssql/bin/sqlservr &
      echo 'Waiting for SQL Server to start...' &&
      sleep 15 &&
      echo 'Creating custom database...' &&
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 123 -N o -Q 'CREATE DATABASE [test];' &&
      wait
      "
